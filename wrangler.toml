$schema = "./node_modules/wrangler/config-schema.json"
name = "workersssh"
main = "src/index.ts"
compatibility_date = "2026-06-08"

# 取消注释下方配置即可绑定自定义域名
# [route]
# pattern = "ssh.example.com"
# zone_name = "example.com"

# KV Namespace - 用于存储密码和 SSH 连接配置
# Cloudflare Dashboard 部署时会自动提示创建或绑定
[[kv_namespaces]]
binding = "WORKERSSH_KV"
id = ""
preview_id = ""

[vars]
ENVIRONMENT = "production"