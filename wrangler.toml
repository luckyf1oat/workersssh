name = "workersssh"
main = "src/index.ts"
compatibility_date = "2026-06-08"

# 静态资源目录
assets = { directory = "public", binding = "ASSETS" }

# 绑定自定义域名（可选）
# [route]
# pattern = "ssh.example.com"
# zone_name = "example.com"

# KV 存储 - 用于保存密码和 SSH 连接配置
[[kv_namespaces]]
binding = "WORKERSSH_KV"
id = "8ad346330c214329a3ff0348de6dfd5d"
preview_id = "8ad346330c214329a3ff0348de6dfd5d"
[vars]
ENVIRONMENT = "production"