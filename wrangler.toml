name = "workersssh"
main = "src/index.ts"
compatibility_date = "2026-06-08"

# 绑定自定义域名（可选）
# [route]
# pattern = "ssh.example.com"
# zone_name = "example.com"

# KV 存储 - 用于保存密码和 SSH 连接配置
# GitHub Actions 部署时会自动创建并填充 ID
[[kv_namespaces]]
binding = "WORKERSSH_KV"
id = ""
preview_id = ""

[vars]
ENVIRONMENT = "production"